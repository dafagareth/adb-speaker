name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/receiver.py check
      - run: python -m build
      - run: python scripts/smoke_wheel.py
      - run: cmake -S native/windows -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
  receiver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - run: python3 scripts/receiver.py build
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-receiver
          path: build/classes.dex
          if-no-files-found: error
  portable-linux:
    needs: [test, receiver]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-receiver
          path: build/ci-receiver
      - run: cp build/ci-receiver/classes.dex src/adb_speaker/assets/receiver.dex
      - run: make portable smoke
      - uses: actions/upload-artifact@v4
        with:
          name: adb-speaker-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
  portable-windows:
    needs: [test, receiver]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: compiled-receiver
          path: build/ci-receiver
      - run: Copy-Item build/ci-receiver/classes.dex src/adb_speaker/assets/receiver.dex
      - run: python packaging/windows/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: adb-speaker-windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
