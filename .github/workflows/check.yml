name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test host lifecycle
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compile Android receiver
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
          python3 scripts/receiver.py build
      - name: Check bundled receiver source marker
        run: python3 scripts/receiver.py check
